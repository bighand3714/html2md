name: "Nintendo News"
site_id: nintendo_news
url_patterns:
  - "nintendo.com"
  - "nintendo.co.uk"
meta_selectors:
  - "meta[property='og:site_name'][content='Nintendo of Europe SE']"
  - "meta[property='og:url'][content*='nintendo.com']"
  - "meta[property='og:url'][content*='nintendo.co.uk']"
encoding: utf-8

content:
  main_selector: ".news-article-content"
  title_selector: "h1.news-detail-headline, h1"
  subtitle_selector: null
  remove_selectors:
    - "h1.news-detail-headline"
    - ".pageheader-breadcrumb"
    - ".overview-news-list"
    - ".news-sidebox"
    - ".modal"
    - "style"
    - "script"
    - "noscript"

citations:
  superscript_selector: "sup.reference"
  cite_href_pattern: "#cite_note-(.+)"
  display_number_attr: null
  notes_pattern: "^[a-z]$"
  refs_pattern: "^\\d+$"
  references_container_selector: ".mw-references-wrap ol.references, ol.references"
  reference_item_selector: "li"
  reference_item_id_attr: "id"
  reference_item_id_prefix: "cite_note-"

elements:
  infobox_handling: "table"
  toc_handling: "remove"
  heading_offset: 0
  template_selectors: []

links:
  base_url: "https://www.nintendo.co.uk"
  external_link_sections: []
