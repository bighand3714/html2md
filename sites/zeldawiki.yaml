name: "ZeldaWiki"
site_id: zeldawiki
url_patterns:
  - "zeldawiki.wiki"
  - "zelda.gamepedia.com"
  - "zelda.fandom.com"
meta_selectors:
  - "meta[property='og:site_name'][content='Zelda Dungeon Wiki']"
  - "meta[property='og:site_name'][content='Zelda Wiki']"
  - "link[rel='canonical'][href*='zeldawiki']"
encoding: utf-8

content:
  main_selector: "#mw-content-text"
  title_selector: "#firstHeading"
  subtitle_selector: null
  remove_selectors:
    - ".mw-editsection"
    - "[role='navigation']"
    - ".mw-jump-link"
    - ".page-header__actions"
    - ".mw-indicators"
    - ".printfooter"
    - "#catlinks"
    - ".mw-hidden-catlinks"
    - ".CategoryTreeBullet"

citations:
  superscript_selector: "sup.reference"
  cite_href_pattern: "#cite_note-(.+)"
  display_number_attr: null
  notes_pattern: "^[a-z]$"
  refs_pattern: "^\\d+$"
  references_container_selector: ".mw-references-wrap ol.references, ol.references"
  reference_item_selector: "li"
  reference_item_id_attr: "id"
  reference_item_id_prefix: "cite_note-"

elements:
  infobox_handling: "table"
  toc_handling: "remove"
  heading_offset: 0
  template_selectors:
    - ".navbox"
    - ".NavFrame"

links:
  # 必须留空：本策略同时服务 zeldawiki.wiki 与 zeldadungeon.net 的 wiki 页，
  # 写死任一个域名都会把另一边的站内相对链接（/wiki/XXX）拼到错误的站上
  # ——实测写死 zeldadungeon.net 后，zeldawiki.wiki 页面的 300+ 条 /wiki/ 链接
  # 全被拼到 zeldadungeon.net，点开提示"没有页面使用该文件"。
  # 留空时 Pipeline 会从页面自带的 <link rel="canonical"> 自动探测，两边都对。
  base_url: ""
  external_link_sections:
    - "#External_links"
